name: Repair dependencies

on:
  workflow_dispatch:

# Governance: workflows are read-only by default.
# This workflow may update files only inside the temporary CI runner;
# it never commits or pushes changes back to the repository.
permissions:
  contents: read

concurrency:
  group: dependency-repair
  cancel-in-progress: true

jobs:
  repair:
    name: Check and repair dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Regenerate lockfile and install
        run: npm install

      - name: Show dependency changes
        run: git diff -- package.json package-lock.json

      - name: Run unit tests
        run: npm test

      - name: Build production
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high
