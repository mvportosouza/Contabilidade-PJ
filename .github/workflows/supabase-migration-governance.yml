name: Supabase Migration Governance

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "docs/SUPABASE_MIGRATION_LEDGER.md"
      - "docs/SUPABASE_NEW_TABLE_AUDIT.md"
      - ".github/workflows/supabase-migration-governance.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "docs/SUPABASE_MIGRATION_LEDGER.md"
      - "docs/SUPABASE_NEW_TABLE_AUDIT.md"
      - ".github/workflows/supabase-migration-governance.yml"
  workflow_dispatch:

# Read-only governance workflow.
# It never connects to Supabase and never changes the repository.
permissions:
  contents: read

concurrency:
  group: supabase-migration-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migration-governance:
    name: Supabase migration governance
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify migration directory
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -d "supabase/migrations" ]; then
            echo "::error::supabase/migrations directory is missing."
            exit 1
          fi

          found=0
          while IFS= read -r -d '' file; do
            found=1

            if [ ! -s "$file" ]; then
              echo "::error file=$file::Migration file is empty."
              exit 1
            fi

            if grep -Ein '^[[:space:]]*(COMMIT|ROLLBACK)[[:space:]]*;' "$file"; then
              echo "::error file=$file::Migration must not contain COMMIT/ROLLBACK statements."
              exit 1
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z)

          if [ "$found" -eq 0 ]; then
            echo "::error::No SQL migration files were found."
            exit 1
          fi

          echo "Migration directory verified."

      - name: Check newly added migration files
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            changed="$(git diff --name-status "${{ github.event.pull_request.base.sha }}"...HEAD -- 'supabase/migrations/**' || true)"
          elif [ "${{ github.event_name }}" = "push" ]; then
            changed="$(git diff-tree --no-commit-id --name-status -r "$GITHUB_SHA" -- 'supabase/migrations/**' || true)"
          else
            changed=""
          fi

          if [ -z "$changed" ]; then
            echo "No migration files were added in this change."
            exit 0
          fi

          echo "$changed"

          while IFS=$'\t' read -r status file; do
            [ -n "$file" ] || continue

            # Existing historical migrations are not rewritten by this check.
            case "$status" in
              A)
                case "$file" in
                  supabase/migrations/*.sql) ;;
                  *)
                    echo "::error file=$file::New migration files must be SQL files under supabase/migrations/."
                    exit 1
                    ;;
                esac

                if [ ! -s "$file" ]; then
                  echo "::error file=$file::New migration file is empty."
                  exit 1
                fi
                ;;
            esac
          done <<< "$changed"

          echo "New migration files passed governance checks."

      - name: Verify governance documentation
        shell: bash
        run: |
          set -euo pipefail

          test -s "docs/SUPABASE_MIGRATION_LEDGER.md"
          test -s "docs/SUPABASE_NEW_TABLE_AUDIT.md"

          grep -Fq "Every future structural database change must have a corresponding migration"             "docs/SUPABASE_MIGRATION_LEDGER.md"

          grep -Fq "supabase/migrations/"             "docs/SUPABASE_NEW_TABLE_AUDIT.md"

          echo "Governance documentation verified."

      - name: Confirm read-only scope
        run: |
          echo "Governance checks completed."
          echo "No Supabase DDL/DML was executed."
          echo "No GitHub write operation was requested."
          echo "No Vercel configuration was changed."
